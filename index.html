<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #0f172a; color: #fff; height: 100vh; overflow: hidden; }
  #auth { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; padding: 20px; }
  #auth h2 { margin-bottom: 10px; }
  #auth input { width: 100%; max-width: 300px; padding: 14px; border-radius: 10px; border: none; background: #1e293b; color: #fff; font-size: 16px; }
  #auth button { width: 100%; max-width: 300px; padding: 14px; border: none; border-radius: 10px; background: #6366f1; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
  #auth button.gray { background: #334155; }
  #err { color: #f87171; font-size: 14px; height: 18px; text-align: center; }

  #chat { display: none; height: 100vh; flex-direction: column; }
  #chat.show { display: flex; }
  #top { padding: 14px 20px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
  #top button { padding: 6px 12px; border: none; border-radius: 6px; background: #334155; color: #fff; cursor: pointer; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .msg { max-width: 75%; background: #1e293b; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; word-wrap: break-word; }
  .msg b { font-size: 12px; color: #818cf8; display: block; margin-bottom: 2px; }
  .msg.own { margin-left: auto; background: #4f46e5; }
  .msg.own b { color: #c7d2fe; }
  #form { display: flex; gap: 8px; padding: 12px; background: #1e293b; }
  #form input { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #0f172a; color: #fff; font-size: 15px; }
  #form button { padding: 12px 20px; border: none; border-radius: 10px; background: #6366f1; color: #fff; cursor: pointer; font-size: 18px; }
</style>
</head>
<body>

<!-- Экран входа -->
<div id="auth">
  <h2>💬 Чат</h2>
  <input id="email" type="email" placeholder="Email (например, anya@mail.ru)">
  <input id="pass" type="password" placeholder="Пароль (минимум 6 символов)">
  <div id="err"></div>
  <button onclick="reg()">Регистрация</button>
  <button class="gray" onclick="log()">Вход</button>
</div>

<!-- Экран чата -->
<div id="chat">
  <div id="top">
    <span>Вы: <b id="me"></b></span>
    <button onclick="out()">Выйти</button>
  </div>
  <div id="msgs"></div>
  <form id="form" onsubmit="send(event)">
    <input id="text" placeholder="Сообщение..." required autocomplete="off">
    <button>➤</button>
  </form>
</div>

<!-- Подключаем Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Твои ключи
  const firebaseConfig = {
    apiKey: "AIzaSyAdfVbrv7JAwZGdVgCapemd8a65R8uRPRs",
    authDomain: "shepot-db359.firebaseapp.com",
    projectId: "shepot-db359",
    storageBucket: "shepot-db359.firebasestorage.app",
    messagingSenderId: "378918064606",
    appId: "1:378918064606:web:d528037e05ee711ecb4d4f"
  };

  // Запуск Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const msgsCollection = collection(db, 'messages');

  const $ = id => document.getElementById(id);
  const apiErr = (code) => {
    if(code === 'auth/email-already-in-use') return 'Этот email уже занят';
    if(code === 'auth/invalid-credential' || code === 'auth/user-not-found' || code === 'auth/wrong-password') return 'Неверный email или пароль';
   if(code === 'auth/weak-password') return 'Пароль слишком короткий (мин. 6 символов)';
    if(code === 'auth/invalid-email') return 'Некорректный email';
    return code;
  };

  // --- РЕГИСТРАЦИЯ ---
  window.reg = async () => {
    const email = $('email').value.trim();
    const pass = $('pass').value;
    $('err').textContent = '';
    try {
      await createUserWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      $('err').textContent = apiErr(e.code);
    }
  };

  // --- ВХОД ---
  window.log = async () => {
    const email = $('email').value.trim();
    const pass = $('pass').value;
    $('err').textContent = '';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      $('err').textContent = apiErr(e.code);
    }
  };

  // --- ВЫХОД ---
  window.out = () => signOut(auth);

  // --- ОТПРАВКА ---
  window.send = async (e) => {
    e.preventDefault();
    const text = $('text').value.trim();
    if(!text) return;
    $('text').value = '';
    const nick = auth.currentUser.email.split('@')[0];
    await addDoc(msgsCollection, { nick, text, time: Date.now() });
  };

  // --- СЛЕЖИМ ЗА ВХОДОМ ---
  let unsubscribeMsgs = null;

  onAuthStateChanged(auth, user => {
    if(user) {
      $('auth').style.display = 'none';
      $('chat').classList.add('show');
      $('me').textContent = user.email.split('@')[0];

      // Загружаем сообщения в реальном времени
      const q = query(msgsCollection, orderBy('time', 'asc'));
      unsubscribeMsgs = onSnapshot(q, (snapshot) => {
        $('msgs').innerHTML = '';
        snapshot.forEach(doc => {
          const m = doc.data();
          const isOwn = m.nick === user.email.split('@')[0];
          const div = document.createElement('div');
          div.className = 'msg' + (isOwn ? ' own' : '');
          
          const b = document.createElement('b');
          b.textContent = m.nick;
          
          const t = document.createElement('span');
          t.textContent = m.text;
          
          div.append(b, t);
          $('msgs').appendChild(div);
        });
        $('msgs').scrollTop = $('msgs').scrollHeight;
      });

    } else {
      $('auth').style.display = 'flex';
      $('chat').classList.remove('show');
      if(unsubscribeMsgs) unsubscribeMsgs();
    }
  });
</script>
</body>
</html>
